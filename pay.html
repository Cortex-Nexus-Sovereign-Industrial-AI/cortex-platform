<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Cortex Intelligence Nexus</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #101827;
        --panel: rgba(17,24,39,0.9);
        --primary: #6366f1;
        --secondary: #ec4899;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --line: rgba(255,255,255,0.08);
        --success: #10b981;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        width: min(880px, 92%);
        margin: 0 auto;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 50px 0;
      }

      .card {
        width: 100%;
        background: rgba(17,24,39,0.9);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
      }

      .eyebrow {
        color: #a5b4fc;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.74rem;
        font-weight: 800;
      }

      h1 {
        margin: 14px 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }

      .summary {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        padding: 18px 20px;
        border-radius: 14px;
        margin: 24px 0;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-row:last-child {
        border-bottom: none;
      }

      .muted { color: var(--muted); }
      .total { font-weight: 800; font-size: 1.2rem; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 16px 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        text-decoration: none;
        font-weight: 800;
        margin-top: 12px;
      }

      .info {
        color: var(--muted);
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container">
        <div class="card">
          <p class="eyebrow">Cortex Intelligence Nexus</p>
          <h1>Complete your order</h1>

          <div class="summary">
            <div class="summary-row">
              <span class="muted">Product</span>
              <strong>30-Day AI Content System</strong>
            </div>
            <div class="summary-row">
              <span class="muted">Price</span>
              <strong>₦22,000</strong>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span>₦22,000</span>
            </div>
          </div>

          <a class="btn" href="https://paystack.shop/pay/cortex-demo" target="_blank" rel="noopener noreferrer">Pay with Paystack</a>

          <p class="info">
            After payment, your access will be granted and the next onboarding step will be sent to you.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
