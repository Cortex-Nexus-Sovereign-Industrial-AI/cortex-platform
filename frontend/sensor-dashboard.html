<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeComplex AI • Live Sensor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #0f0; margin: 0; padding: 20px; }
        h1 { color: #0f0; text-align: center; }
        .card { background: #1a1a1a; border: 1px solid #0f0; border-radius: 8px; padding: 15px; margin: 15px 0; }
        canvas { max-width: 100%; height: 220px !important; }
        #log { height: 200px; overflow-y: auto; background: #111; padding: 10px; font-family: monospace; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>🚀 MikeComplex AI • Live Sensor Dashboard</h1>

    <div class="card">
        <h2>Motion Magnitude Over Time</h2>
        <canvas id="motionChart"></canvas>
    </div>

    <div class="card">
        <h2>Battery Level Over Time</h2>
        <canvas id="batteryChart"></canvas>
    </div>

    <div class="card">
        <h2>Recent Raw Sensor Log</h2>
        <pre id="log"></pre>
    </div>

    <script>
        let motionData = [];
        let batteryData = [];
        let labels = [];

        const motionCtx = document.getElementById('motionChart').getContext('2d');
        const batteryCtx = document.getElementById('batteryChart').getContext('2d');

        const motionChart = new Chart(motionCtx, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'Motion Magnitude', borderColor: '#0f0', data: motionData, tension: 0.3 }] },
            options: { scales: { y: { beginAtZero: true } } }
        });

        const batteryChart = new Chart(batteryCtx, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'Battery %', borderColor: '#ff0', data: batteryData, tension: 0.3 }] },
            options: { scales: { y: { min: 0, max: 100 } } }
        });

        async function updateDashboard() {
            try {
                const response = await fetch('logs/sensor_data.jsonl');
                const text = await response.text();
                const lines = text.trim().split('\n').slice(-30); // last 30 entries

                labels = [];
                motionData = [];
                batteryData = [];

                lines.forEach(line => {
                    if (!line) return;
                    const entry = JSON.parse(line);
                    const time = new Date(entry.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    
                    labels.push(time);
                    motionData.push(entry.motion ? entry.motion.magnitude || 0 : 0);
                    batteryData.push(entry.battery ? entry.battery.percentage || 0 : 0);
                });

                motionChart.data.labels = labels;
                motionChart.data.datasets[0].data = motionData;
                motionChart.update();

                batteryChart.data.labels = labels;
                batteryChart.data.datasets[0].data = batteryData;
                batteryChart.update();

                document.getElementById('log').textContent = lines.slice(-10).join('\n');

            } catch (e) {
                console.log("Dashboard update error:", e.message);
            }
        }

        // Update every 8 seconds
        setInterval(updateDashboard, 8000);
        updateDashboard(); // Initial load
    </script>
</body>
</html>
