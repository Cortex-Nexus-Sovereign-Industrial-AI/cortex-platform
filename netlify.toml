# CINIS NEXUS — Netlify (static + pure Node functions)
# Primary public host: https://cortex-platforms.netlify.app
# Identity SSOT: IDENTITY.md — brand = Cortex Intelligence Nexus only

[build]
  publish = "."
  command = "echo build-ok"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

# --- API (functions) ---
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/paystack-webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/shopify"
  to = "/.netlify/functions/shopify-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/sofa-status"
  to = "/.netlify/functions/sofa-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/sofa-session"
  to = "/.netlify/functions/sofa-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Do NOT rewrite /* → index.html.
# That SPA rule was swallowing real files (metrics-dashboard, identity, offers).
# Unknown paths → 404 (honest). Explicit public pages live as root HTML files.
