name: CINIS Dashboard - SSOT Aligned Remote Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'SSOT.md'
      - 'IDENTITY.md'
      - 'cortex-platform/**'
      - 'index.html'
      - 'offers.html'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'netlify/functions/*.test.js'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'docs/commerce/**'
      - 'docs/LAUNCH_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify canonical identity and checkout CTA
        run: |
          set -eu
          grep -q "cortex-platforms.netlify.app" SSOT.md
          grep -q "Cortex Intelligence Nexus" IDENTITY.md
          grep -q "paystack.shop/pay/cortex-demo" offers.html
          echo "Canonical identity and checkout CTA checks passed."

      - name: Install dependencies when lockfile exists
        run: |
          set -eu
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No root package manifest; static site and Netlify functions only."
          fi

      - name: Run project build if defined
        run: npm run build --if-present

      - name: Run Paystack webhook and order-matching safety tests
        run: |
          node --test netlify/functions/paystack-webhook.test.js
          node --test backend/lib/paystackOrderMatch.test.js
          node --test backend/lib/webhookIdempotency.test.js

      - name: Validate Netlify deployment inputs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -eu
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Missing GitHub Actions secret: NETLIFY_AUTH_TOKEN" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "Missing GitHub Actions secret: NETLIFY_SITE_ID" && exit 1)
          test -d netlify/functions || (echo "Netlify functions directory missing" && exit 1)
          echo "Deployment credentials are present (values are not printed)."

      - name: Deploy static site and Netlify Functions to primary site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -eu
          npx --yes netlify-cli deploy \
            --prod \
            --dir . \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "SSOT-aligned Cortex Intelligence Nexus deploy"

# This workflow deploys only to the canonical Netlify site.
# Payment mode and Paystack credentials are intentionally not changed here.
