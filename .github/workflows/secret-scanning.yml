name: Secret Scanning (Gitleaks)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # Daily at 04:00 UTC

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF upload if needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for thorough scanning

      - name: Run Gitleaks CLI (license-free)
        uses: docker://zricethezav/gitleaks:v8.24.2
        with:
          args: detect --source . --verbose --redact --exit-code 1
