name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s globstar nullglob
          for file in **/*.html **/*.css **/*.js **/*.mjs **/*.svg **/*.png **/*.jpg **/*.jpeg **/*.webp **/*.gif **/*.ico **/*.pdf **/*.xml **/*.json **/*.woff **/*.woff2 **/*.ttf **/*.webmanifest; do
            case "$file" in
              .git/*|.github/*|node_modules/*|netlify/*|api/*|'(api'/*|backend/*|prisma/*|core-monolith/*|cortex.api/*|social-media-integration/*|millions-sdk-core/*|shadow-vault-schema/*|dev-console/*|dist/*) continue ;;
              server.js|webpack.config.js|package.json|package-lock.json) continue ;;
            esac
            [ -f "$file" ] || continue
            mkdir -p "dist/$(dirname "$file")"
            cp "$file" "dist/$file"
          done
          if [ -f CNAME ]; then cp CNAME dist/; fi
          if [ -f robots.txt ]; then cp robots.txt dist/; fi
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/giftvault/index.html
          grep -q "GiftVault" dist/giftvault/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
